<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; }
  </style>

  <!-- Terminal Window Base -->
  <rect width="900" height="230" rx="12" fill="url(#term-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <rect width="900" height="36" rx="12" fill="#0F172A" />
  <rect y="24" width="900" height="12" fill="#0F172A" />
  <line x1="0" y1="36" x2="900" y2="36" stroke="#1E293B" stroke-width="1" />

  <!-- Window Action Buttons -->
  <circle cx="24" cy="18" r="6" fill="#EF4444" />
  <circle cx="44" cy="18" r="6" fill="#F59E0B" />
  <circle cx="64" cy="18" r="6" fill="#10B981" />

  <!-- Title Text -->
  <text x="450" y="22" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">
    raquibi@workstation: ~/projects/firststep-business-os
  </text>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 60)" class="font-mono" font-size="12.5">
    <!-- Command Line -->
    <text y="0">
      <tspan fill="#38BDF8" font-weight="700">raquibi@cloud-node</tspan><tspan fill="#64748B">:</tspan><tspan fill="#A855F7">~/firststep</tspan><tspan fill="#F8FAFC">$</tspan> <tspan fill="#F1F5F9" font-weight="600">./deploy --env=production --stack=full</tspan>
    </text>

    <!-- Output 1 -->
    <text y="26">
      <tspan fill="#10B981">✔</tspan> <tspan fill="#E2E8F0">Client Engine:</tspan> <tspan fill="#38BDF8">Next.js 14 App Router (SSR, Edge Caching, Sub-second Hydration)</tspan>
    </text>

    <!-- Output 2 -->
    <text y="48">
      <tspan fill="#10B981">✔</tspan> <tspan fill="#E2E8F0">Backend Core:</tspan> <tspan fill="#14B8A6">Laravel 11 API + WebSockets Broadcast + Redis Job Queues</tspan>
    </text>

    <!-- Output 3 -->
    <text y="70">
      <tspan fill="#10B981">✔</tspan> <tspan fill="#E2E8F0">Data Layer:</tspan> <tspan fill="#38BDF8">PostgreSQL 16 Multi-Tenant Scoping (Strict Isolation Active)</tspan>
    </text>

    <!-- Output 4 -->
    <text y="92">
      <tspan fill="#10B981">✔</tspan> <tspan fill="#E2E8F0">AI &amp; Automation:</tspan> <tspan fill="#A855F7">RAG Knowledge Engine + n8n Event Pipelines Synchronized</tspan>
    </text>

    <!-- Output 5 Status Ready -->
    <text y="118">
      <tspan fill="#F59E0B">⚡ System Ready:</tspan> <tspan fill="#F8FAFC" font-weight="700">FirstStep Business OS is Live</tspan> <tspan fill="#64748B">|</tspan> <tspan fill="#10B981">Open to Canadian Tech &amp; Global Remote Teams</tspan>
    </text>
  </g>
</svg>
