<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="radial-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-glow-left" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .status-dot {
      animation: pulse 2.5s infinite ease-in-out;
      transform-origin: 46px 42px;
    }
  </style>

  <!-- Base Card -->
  <rect width="900" height="320" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Grids & Glowing Blobs -->
  <rect width="900" height="320" rx="16" fill="url(#grid)" />
  <rect width="900" height="320" rx="16" fill="url(#radial-glow)" />
  <rect width="900" height="320" rx="16" fill="url(#radial-glow-left)" />

  <!-- Top Status Bar / Chip -->
  <g transform="translate(36, 30)">
    <!-- Pill Background -->
    <rect width="365" height="28" rx="14" fill="#0F172A" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="5" fill="#10B981" class="status-dot" filter="url(#glow)" />
    <circle cx="16" cy="14" r="3.5" fill="#10B981" />
    <text x="32" y="18" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono" letter-spacing="0.5">OPEN TO REMOTE ROLES · CANADA / GLOBAL</text>
  </g>

  <!-- Location / Timezone Chip -->
  <g transform="translate(680, 30)">
    <rect width="184" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="18" fill="#94A3B8" font-size="11" font-weight="600" class="font-mono">📍 MOROCCO · EST/PST</text>
  </g>

  <!-- Decorative Accent Line -->
  <path d="M 36 78 L 864 78" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Hero Name -->
  <text x="36" y="132" fill="url(#title-grad)" font-size="40" font-weight="900" class="font-sans" letter-spacing="-0.5">ABDERRAHMANE RAQUIBI</text>

  <!-- Professional Subtitle -->
  <text x="38" y="166" fill="#38BDF8" font-size="16" font-weight="700" class="font-mono" letter-spacing="2">FULL-STACK PRODUCT ENGINEER</text>

  <!-- Core Competency Line -->
  <text x="38" y="202" fill="#94A3B8" font-size="14" font-weight="400" class="font-sans">
    Specializing in <tspan fill="#F8FAFC" font-weight="600">Multi-Tenant SaaS Architecture</tspan>, <tspan fill="#38BDF8" font-weight="600">AI-Powered Business Workflows</tspan> &amp; <tspan fill="#14B8A6" font-weight="600">Production Systems</tspan>.
  </text>

  <!-- Bottom Feature Badges / Highlights -->
  <g transform="translate(36, 236)">
    <!-- Flagship OS Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="52" rx="10" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="16" y="22" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">FLAGSHIP PLATFORM</text>
      <text x="16" y="40" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">🚀 FirstStep Business OS</text>
    </g>

    <!-- Architecture Focus Badge -->
    <g transform="translate(276, 0)">
      <rect width="270" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="16" y="22" fill="#14B8A6" font-size="11" font-weight="700" class="font-mono">CORE SPECIALTY</text>
      <text x="16" y="40" fill="#F1F5F9" font-size="13" font-weight="600" class="font-sans">⚡ Next.js · Laravel · Postgres · AI</text>
    </g>

    <!-- Remote Readiness Badge -->
    <g transform="translate(562, 0)">
      <rect width="266" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="16" y="22" fill="#A855F7" font-size="11" font-weight="700" class="font-mono">COLLABORATION</text>
      <text x="16" y="40" fill="#F1F5F9" font-size="13" font-weight="600" class="font-sans">🇨🇦 Async &amp; Canadian Team Ready</text>
    </g>
  </g>

  <!-- Subtle Corner Neon Glows -->
  <circle cx="880" cy="20" r="1.5" fill="#38BDF8" />
  <circle cx="850" cy="40" r="1" fill="#14B8A6" />
  <circle cx="20" cy="300" r="1.5" fill="#0284C7" />
</svg>
